name: Plantty
options:
  bundleIdPrefix: dev.plantty
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Plantty:
    type: application
    platform: macOS
    sources:
      - Plantty
      - path: vendor/share/terminfo
        type: folder
        buildPhase: resources
      - path: vendor/share/ghostty
        type: folder
        buildPhase: resources
      # License notices must ship inside the app (libghostty is statically linked).
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - framework: vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.plantty.Plantty
        PRODUCT_NAME: Plantty
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "6"
        # libghostty is built for the host only (-Dxcframework-target=native).
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys; holds Sparkle's feed URL and public key.
        INFOPLIST_FILE: Plantty/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Plantty
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        OTHER_LDFLAGS: ["-lc++"]
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        # Required for notarization. The entitlements let programs running inside the terminal
        # ask for privacy permissions (mic, camera, AppleScript…), same set as Ghostty.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Plantty/Plantty.entitlements
        INFOPLIST_KEY_NSAppleEventsUsageDescription: A program running within Plantty would like to use AppleScript.
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: A program running within Plantty would like to access your system's audio.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: A program running within Plantty would like to use Bluetooth.
        INFOPLIST_KEY_NSCalendarsUsageDescription: A program running within Plantty would like to access your Calendar.
        INFOPLIST_KEY_NSCameraUsageDescription: A program running within Plantty would like to use the camera.
        INFOPLIST_KEY_NSContactsUsageDescription: A program running within Plantty would like to access your Contacts.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: A program running within Plantty would like to access the local network.
        INFOPLIST_KEY_NSLocationUsageDescription: A program running within Plantty would like to access your location information.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: A program running within Plantty would like to use your microphone.
        INFOPLIST_KEY_NSMotionUsageDescription: A program running within Plantty would like to access motion data.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: A program running within Plantty would like to access your Photo Library.
  PlanttyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PlanttyTests
      # SplitNode is pure; compile it straight in so tests don't boot the terminal app.
      - Plantty/Model/SplitNode.swift
      - Plantty/Usage/UsageModel.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  Plantty:
    build:
      targets:
        Plantty: all
        PlanttyTests: [test]
    test:
      targets: [PlanttyTests]
